server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The Content Security Policy is in index.html (it depends on build-time URLs). frame-ancestors only works as a header.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The path of an invitation link holds its token: keep it out of the access log and out of Referer headers.
    # add_header here replaces the server-level list, so the list is repeated.
    location /invite/ {
        access_log off;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /index.html =404; # served from this block: an internal redirect would log under "location /"
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
