# Test-only overrides. Feature tests fire many requests as one user, so limits are off here; RateLimitTest turns them on.
app.rate-limit.enabled=false
# The shared circuit breaker must not open because one test class fails the fake model on purpose (BreakerTest builds its own).
app.agent.breaker.minimum-calls=100000
app.agent.breaker.window=100000
# Tests index embeddings explicitly.
app.embeddings.initial-delay=1h
