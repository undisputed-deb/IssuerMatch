spring.application.name=issuermatch

# Local secrets: backend/.env (git-ignored). Optional, so CI/tests can run without it.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# JPA: schema is owned by Flyway. Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paging: never let a client ask for a huge page.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Reject JSON with fields we do not know (mass-assignment / typo protection).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Kafka. Docker Compose exposes the broker on localhost:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=issuermatch
spring.kafka.consumer.auto-offset-reset=earliest
app.outbox.poll-ms=500
# Several scheduled jobs (outbox publisher, reaper, reconciliation, cleanup): a busy publisher must not starve the rest.
spring.task.scheduling.pool.size=4

# LLM: Gemini through Spring AI. The key only ever comes from the GEMINI_API_KEY environment variable.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2

# Agent limits (excessive-agency control): hard cap on tool calls per run and on total run time.
app.agent.max-tool-calls=12
app.agent.timeout=60s

# Auth: Supabase issues the JWTs, this API only verifies them. No defaults on purpose:
# a missing SUPABASE_JWKS_URI or SUPABASE_URL stops the app at startup instead of running unprotected.
app.auth.jwks-uri=${SUPABASE_JWKS_URI}
app.auth.issuer=${SUPABASE_URL}/auth/v1
app.auth.audience=authenticated

# The one browser origin allowed to call this API (the Vite dev server by default). Never a wildcard.
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:5173}

# Logging: every line carries the correlation id of its request or event.
logging.pattern.correlation=[%X{correlationId:-}]\u0020
logging.include-application-name=false
# Postgres error messages may quote row data. Keep that detail out of exceptions and therefore out of logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Actuator: health is public (no details), everything else is admin-only (see SecurityConfig). Nothing else is exposed.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# JSON logs for machines: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (docker compose does). Plain text for humans by default.
